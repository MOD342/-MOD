<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>أنمي MOD - Otaku Hub</title>
    <link rel="icon" type="image/png" href="./app_icon.png" />
    <link rel="manifest" href="./manifest.json" />
    
    <!-- تهيئة توافقية PWA والهواتف الذكية بوضع ملء الشاشة -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="أنمي MOD" />
    <link rel="apple-touch-icon" href="./app_icon.png" />
    <meta name="theme-color" content="#0c0e16" />

    <script>
      (function () {
        try {
          var mode = localStorage.getItem('anime_mod_theme_mode') || 'dark';
          if (mode !== 'light' && mode !== 'dark' && mode !== 'amoled' && mode !== 'auto') {
            mode = 'dark';
          }
          var resolved = mode === 'auto'
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : mode;
          var root = document.documentElement;
          root.setAttribute('data-theme-mode', mode);
          root.setAttribute('data-resolved-theme', resolved);
          root.style.colorScheme = resolved === 'light' ? 'light' : 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', resolved === 'light' ? '#f4f5f8' : resolved === 'amoled' ? '#000000' : '#0c0e16');
          }
        } catch (e) {}
      })();
    </script>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <script>
      // وضع الاتصال المباشر بدون تخزين مؤقت: تنظيف وإلغاء أي Service Worker أو CacheStorage قديم في المتصفح
      if ('caches' in window) {
        caches.keys().then((names) => {
          names.forEach((name) => caches.delete(name));
        }).catch(() => {});
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const reg of registrations) {
            reg.unregister().catch(() => {});
          }
        }).catch(() => {});
      }

      // اعتراض حدث التثبيت التلقائي لحفظه وطلب التثبيت يدوياً عند ضغط الزر في واجهة المستخدم
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-installable', { detail: e }));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
