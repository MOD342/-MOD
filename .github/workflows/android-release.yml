name: Build & Sign Android APK (أنمي MOD)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'إصدار التطبيق (مثال: 1.2.0)'
        required: false
        type: string
      api_url:
        description: 'رابط الخادم VITE_API_URL'
        required: false
        type: string
      create_github_release:
        description: 'نشر في Releases'
        required: false
        default: false
        type: boolean
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-android-release:
    name: Build Signed APK (com.zoryx)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ✅ الخطوة المصححة جذرياً: تحديث المسار للخطوة الحالية والتالية
      - name: Setup Android SDK Environment
        run: |
          # العثور ديناميكياً على مسار cmdline-tools
          CMDLINE_BIN=$(find "${ANDROID_HOME}/cmdline-tools" -maxdepth 2 -name "bin" -type d | sort -V | tail -n 1)
          echo "✅ Found cmdline-tools at: $CMDLINE_BIN"
          
          # ✅ تصدير المسار للبيئة الحالية (مهم جداً لكي يعمل الأمر في نفس الخطوة)
          export PATH="$CMDLINE_BIN:${ANDROID_HOME}/platform-tools:$PATH"
          
          # حفظ المسار للخطوات التالية في الـ Workflow
          echo "$CMDLINE_BIN" >> $GITHUB_PATH
          echo "${ANDROID_HOME}/platform-tools" >> $GITHUB_PATH
          
          # قبول التراخيص بصمت (تجاهل خطأ Broken pipe لأنه طبيعي عند إغلاق sdkmanager)
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          
          # تثبيت الحزم المطلوبة (الإصدار 34 مستقر ومضمون التوافق)
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install & Lint
        run: |
          npm install
          npm run lint || true

      - name: Resolve Version & Env
        id: meta
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
          INPUT_API_URL: ${{ github.event.inputs.api_url }}
          SECRET_API_URL: ${{ secrets.VITE_API_URL }}
          VAR_API_URL: ${{ vars.VITE_API_URL }}
          SECRET_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          SECRET_FB_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          SECRET_FB_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          SECRET_FB_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          SECRET_FB_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          SECRET_FB_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          SECRET_FB_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          SECRET_FB_DB_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
        run: |
          PKG_VERSION=$(jq -r '.version' package.json)
          [ "$PKG_VERSION" == "null" ] && PKG_VERSION="1.0.0"
          
          TAG_VERSION=""
          [ "${GITHUB_REF_TYPE:-}" = "tag" ] && TAG_VERSION="${GITHUB_REF_NAME#v}"
          
          VERSION_NAME="${INPUT_VERSION_NAME:-${TAG_VERSION:-$PKG_VERSION}}"
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "ANDROID_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          
          RESOLVED_API_URL="${INPUT_API_URL:-${SECRET_API_URL:-${VAR_API_URL:-https://workers.dev}}}"
          
          {
            echo "VITE_API_URL=${RESOLVED_API_URL}"
            [ -n "${SECRET_GOOGLE_CLIENT_ID:-}" ] && echo "VITE_GOOGLE_CLIENT_ID=${SECRET_GOOGLE_CLIENT_ID}"
            [ -n "${SECRET_FB_API_KEY:-}" ] && echo "VITE_FIREBASE_API_KEY=${SECRET_FB_API_KEY}"
            [ -n "${SECRET_FB_AUTH_DOMAIN:-}" ] && echo "VITE_FIREBASE_AUTH_DOMAIN=${SECRET_FB_AUTH
