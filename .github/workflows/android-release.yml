name: Build & Sign Android Release (أنمي MOD)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'إصدار التطبيق (اتركه فارغاً لاستخدام نسخة package.json)'
        required: false
        type: string
      api_url:
        description: 'رابط الخادم الخلفي VITE_API_URL (اختياري)'
        required: false
        type: string
      create_github_release:
        description: 'نشر ملفات APK و AAB داخل GitHub Releases'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-release:
    name: Build Signed APK & AAB (com.zoryx)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'scripts/configure-android-permissions.mjs') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Resolve version & build environment
        id: meta
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
          INPUT_API_URL: ${{ github.event.inputs.api_url }}
          SECRET_API_URL: ${{ secrets.VITE_API_URL }}
          VAR_API_URL: ${{ vars.VITE_API_URL }}
          SECRET_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          SECRET_FB_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          SECRET_FB_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          SECRET_FB_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          SECRET_FB_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          SECRET_FB_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          SECRET_FB_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          SECRET_FB_DB_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version || '1.0.0'")
          TAG_VERSION=""
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION_NAME="${INPUT_VERSION_NAME:-${TAG_VERSION:-$PKG_VERSION}}"
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "ANDROID_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          RESOLVED_API_URL="${INPUT_API_URL:-${SECRET_API_URL:-${VAR_API_URL:-https://mod.z-mod342.workers.dev}}}"
          {
            echo "VITE_API_URL=${RESOLVED_API_URL}"
            [ -n "${SECRET_GOOGLE_CLIENT_ID:-}" ] && echo "VITE_GOOGLE_CLIENT_ID=${SECRET_GOOGLE_CLIENT_ID}"
            [ -n "${SECRET_FB_API_KEY:-}" ] && echo "VITE_FIREBASE_API_KEY=${SECRET_FB_API_KEY}"
            [ -n "${SECRET_FB_AUTH_DOMAIN:-}" ] && echo "VITE_FIREBASE_AUTH_DOMAIN=${SECRET_FB_AUTH_DOMAIN}"
            [ -n "${SECRET_FB_PROJECT_ID:-}" ] && echo "VITE_FIREBASE_PROJECT_ID=${SECRET_FB_PROJECT_ID}"
            [ -n "${SECRET_FB_STORAGE_BUCKET:-}" ] && echo "VITE_FIREBASE_STORAGE_BUCKET=${SECRET_FB_STORAGE_BUCKET}"
            [ -n "${SECRET_FB_SENDER_ID:-}" ] && echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${SECRET_FB_SENDER_ID}"
            [ -n "${SECRET_FB_APP_ID:-}" ] && echo "VITE_FIREBASE_APP_ID=${SECRET_FB_APP_ID}"
            [ -n "${SECRET_FB_DB_ID:-}" ] && echo "VITE_FIREBASE_DATABASE_ID=${SECRET_FB_DB_ID}"
          } > .env

      - name: Prepare Release Keystore & Certificate Fingerprints
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "${RUNNER_TEMP}/signing"
          KEYSTORE_PATH="${RUNNER_TEMP}/signing/zoryx-release.keystore"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$KEYSTORE_PATH"
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            SIGNING_MODE="persistent-secret"
          else
            STORE_PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
            KEY_PASS="$STORE_PASS"
            KEY_ALIAS="zoryx-release"
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore "$KEYSTORE_PATH" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Anime MOD, OU=Mobile, O=Zoryx, L=Riyadh, S=Riyadh, C=SA"
            SIGNING_MODE="ephemeral-ci"
          fi

          CERT_INFO=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASS")
          SHA1_FP=$(echo "$CERT_INFO" | grep -E "^\s*SHA1:" | head -n1 | sed -E 's/.*SHA1:\s*//')
          SHA256_FP=$(echo "$CERT_INFO" | grep -E "^\s*SHA256:" | head -n1 | sed -E 's/.*SHA256:\s*//')

          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
          echo "signing_mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"
          echo "sha1=$SHA1_FP" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256_FP" >> "$GITHUB_OUTPUT"

          # Store credentials strictly in ephemeral runner temp env for Gradle step
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

          # Sync public/.well-known/assetlinks.json with actual signing SHA-256 before Vite build
          ANDROID_KEYSTORE_PASSWORD="$STORE_PASS" node scripts/generate-android-signing.mjs --inspect "$KEYSTORE_PATH" --write-assetlinks

      - name: Build Production Web Bundle (dist)
        run: npm run build

      - name: Initialize & Sync Capacitor Android Project
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\n\r ' | base64 -d > android/app/google-services.json
          fi
          node scripts/configure-android-permissions.mjs

      - name: Build Signed Release APK & AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify Signatures & Package Release Outputs
        id: package
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$APK_PATH" ]; then
            echo "❌ لم يتم العثور على ملف app-release.apk الموقع."
            exit 1
          fi
          if [ ! -f "$AAB_PATH" ]; then
            echo "❌ لم يتم العثور على ملف app-release.aab الموقع."
            exit 1
          fi

          APKSIGNER_BIN="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0/apksigner"
          VERIFY_OUT=$("$APKSIGNER_BIN" verify --print-certs "$APK_PATH")
          echo "$VERIFY_OUT"

          mkdir -p release-output
          FINAL_APK="release-output/AnimeMOD-v${{ steps.meta.outputs.version_name }}-com.zoryx-release.apk"
          FINAL_AAB="release-output/AnimeMOD-v${{ steps.meta.outputs.version_name }}-com.zoryx-release.aab"
          cp "$APK_PATH" "$FINAL_APK"
          cp "$AAB_PATH" "$FINAL_AAB"

          cat > release-output/signing-fingerprint-report.txt <<EOF
          Anime MOD (com.zoryx) - Android Release Signing Report
          ======================================================
          Version Name : ${{ steps.meta.outputs.version_name }}
          Version Code : ${{ steps.meta.outputs.version_code }}
          Package Name : com.zoryx
          Signing Mode : ${{ steps.signing.outputs.signing_mode }}
          Key Alias    : ${{ steps.signing.outputs.key_alias }}

          SHA-1 Fingerprint   : ${{ steps.signing.outputs.sha1 }}
          SHA-256 Fingerprint : ${{ steps.signing.outputs.sha256 }}

          Firebase Console Setup (Google Sign-In on Android):
          1. Open Firebase Console -> Project Settings -> Your apps -> Android (com.zoryx)
          2. Add both SHA-1 and SHA-256 fingerprints above.
          3. For persistent release updates across builds, set GitHub Repository Secrets:
             ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
          EOF

          echo "apk_file=$FINAL_APK" >> "$GITHUB_OUTPUT"
          echo "aab_file=$FINAL_AAB" >> "$GITHUB_OUTPUT"

      - name: Write GitHub Step Summary
        run: |
          {
            echo "## ✅ تم بناء وتوقيع النسخة النهائية بنجاح (أنمي MOD)"
            echo ""
            echo "| البند | القيمة |"
            echo "| --- | --- |"
            echo "| اسم الحزمة (Package ID) | \`com.zoryx\` |"
            echo "| الإصدار (Version) | \`${{ steps.meta.outputs.version_name }}\` (Build \`${{ steps.meta.outputs.version_code }}\`) |"
            echo "| وضع التوقيع | \`${{ steps.signing.outputs.signing_mode }}\` |"
            echo "| بصمة **SHA-1** | \`${{ steps.signing.outputs.sha1 }}\` |"
            echo "| بصمة **SHA-256** | \`${{ steps.signing.outputs.sha256 }}\` |"
            echo ""
            if [ "${{ steps.signing.outputs.signing_mode }}" = "ephemeral-ci" ]; then
              echo "> ℹ️ **ملاحظة التوقيع الدائم:** تم توقيع هذا الإصدار بشهادة تلقائية مؤقتة لأن أسرار \`ANDROID_KEYSTORE_BASE64\` غير مضافة بعد في إعدادات المستودع. لتثبيت البصمة لجميع التحديثات المستقبلية ومتجر Play، شغّل \`npm run apk:keystore\` محلياً وأضف الأسرار الأربعة في **Settings > Secrets > Actions** ثم أضف بصمة **SHA-1** في **Firebase Console**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeMOD-Release-APK
          path: ${{ steps.package.outputs.apk_file }}
          retention-days: 30

      - name: Upload Signed Release AAB Artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: AnimeMOD-Release-AAB
          path: ${{ steps.package.outputs.aab_file }}
          retention-days: 30

      - name: Upload Signing Fingerprint Report
        uses: actions/upload-artifact@v4
        with:
          name: Signing-Fingerprint-Report
          path: release-output/signing-fingerprint-report.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_github_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-build.{1}', steps.meta.outputs.version_name, github.run_number) }}
          name: "أنمي MOD v${{ steps.meta.outputs.version_name }} (Build ${{ steps.meta.outputs.version_code }})"
          body: |
            ### النسخة النهائية الموقّعة الجاهزة للنشر — حزمة `com.zoryx`
            - **SHA-1:** `${{ steps.signing.outputs.sha1 }}`
            - **SHA-256:** `${{ steps.signing.outputs.sha256 }}`
          files: |
            ${{ steps.package.outputs.apk_file }}
            ${{ steps.package.outputs.aab_file }}
            release-output/signing-fingerprint-report.txt
