name: Build & Sign Android APK (أنمي MOD)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'إصدار التطبيق (مثال: 1.2.0)'
        required: false
        type: string
      api_url:
        description: 'رابط الخادم VITE_API_URL'
        required: false
        type: string
      create_github_release:
        description: 'نشر في Releases'
        required: false
        default: false
        type: boolean
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-android-release:
    name: Build Signed APK (com.zoryx)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          # استخدام المسار القياسي في GitHub Actions
          CMDLINE_BIN="${ANDROID_HOME}/cmdline-tools/latest/bin"
          echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          
          # قبول التراخيص وتثبيت الأدوات المطلوبة (يُفضل استخدام 34 أو 35 للاستقرار)
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install & Lint
        run: |
          npm install
          npm run lint || true # السماح بالاستمرار حتى لو كانت هناك تحذيرات lint

      - name: Resolve Version & Env
        id: meta
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
          INPUT_API_URL: ${{ github.event.inputs.api_url }}
          SECRET_API_URL: ${{ secrets.VITE_API_URL }}
          VAR_API_URL: ${{ vars.VITE_API_URL }}
          SECRET_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          SECRET_FB_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          SECRET_FB_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          SECRET_FB_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          SECRET_FB_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          SECRET_FB_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          SECRET_FB_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          SECRET_FB_DB_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
        run: |
          # استخدام jq لاستخراج الإصدار بشكل موثوق
          PKG_VERSION=$(jq -r '.version' package.json)
          [ "$PKG_VERSION" == "null" ] && PKG_VERSION="1.0.0"
          
          TAG_VERSION=""
          [ "${GITHUB_REF_TYPE:-}" = "tag" ] && TAG_VERSION="${GITHUB_REF_NAME#v}"
          
          VERSION_NAME="${INPUT_VERSION_NAME:-${TAG_VERSION:-$PKG_VERSION}}"
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "ANDROID_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          
          RESOLVED_API_URL="${INPUT_API_URL:-${SECRET_API_URL:-${VAR_API_URL:-https://workers.dev}}}"
          
          {
            echo "VITE_API_URL=${RESOLVED_API_URL}"
            [ -n "${SECRET_GOOGLE_CLIENT_ID:-}" ] && echo "VITE_GOOGLE_CLIENT_ID=${SECRET_GOOGLE_CLIENT_ID}"
            [ -n "${SECRET_FB_API_KEY:-}" ] && echo "VITE_FIREBASE_API_KEY=${SECRET_FB_API_KEY}"
            [ -n "${SECRET_FB_AUTH_DOMAIN:-}" ] && echo "VITE_FIREBASE_AUTH_DOMAIN=${SECRET_FB_AUTH_DOMAIN}"
            [ -n "${SECRET_FB_PROJECT_ID:-}" ] && echo "VITE_FIREBASE_PROJECT_ID=${SECRET_FB_PROJECT_ID}"
            [ -n "${SECRET_FB_STORAGE_BUCKET:-}" ] && echo "VITE_FIREBASE_STORAGE_BUCKET=${SECRET_FB_STORAGE_BUCKET}"
            [ -n "${SECRET_FB_SENDER_ID:-}" ] && echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${SECRET_FB_SENDER_ID}"
            [ -n "${SECRET_FB_APP_ID:-}" ] && echo "VITE_FIREBASE_APP_ID=${SECRET_FB_APP_ID}"
            [ -n "${SECRET_FB_DB_ID:-}" ] && echo "VITE_FIREBASE_DATABASE_ID=${SECRET_FB_DB_ID}"
          } > .env

      - name: Prepare Signing Keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "${RUNNER_TEMP}/signing" "public/.well-known"
          KEYSTORE_PATH="${RUNNER_TEMP}/signing/zoryx-release.keystore"
          
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$KEYSTORE_PATH"
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            SIGNING_MODE="persistent-secret"
          else
            echo "⚠️ لم يتم العثور على مفاتيح التوقيع، جاري إنشاء مفتاح مؤقت للتجربة فقط"
            STORE_PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
            KEY_PASS="$STORE_PASS"
            KEY_ALIAS="zoryx-release"
            keytool -genkeypair -v -storetype PKCS12 -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=Anime MOD, OU=Mobile, O=Zoryx, L=Riyadh, S=Riyadh, C=SA"
            SIGNING_MODE="ephemeral-ci"
          fi
          
          CERT_INFO=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASS")
          SHA1_FP=$(echo "$CERT_INFO" | grep "SHA1:" | head -n1 | awk '{print $2}')
          SHA256_FP=$(echo "$CERT_INFO" | grep "SHA256:" | head -n1 | awk '{print $2}')
          
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "signing_mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"
          echo "sha1=$SHA1_FP" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256_FP" >> "$GITHUB_OUTPUT"
          
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
          
          [ -f "scripts/generate-android-signing.mjs" ] && ANDROID_KEYSTORE_PASSWORD="$STORE_PASS" node scripts/generate-android-signing.mjs --inspect "$KEYSTORE_PATH" --write-assetlinks || true

      - name: Build Web & Sync Android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          npm run build
          [ ! -d "android" ] && npx cap add android
          npx cap sync android
          
          [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ] && echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\n\r ' | base64 -d > android/app/google-services.json
          
          [ -f "scripts/configure-android-permissions.mjs" ] && node scripts/configure-android-permissions.mjs
          
          # إزالة إعدادات minify بشكل آمن من buildTypes إذا كانت موجودة (بدلاً من signingConfigs)
          if [ -f "android/app/build.gradle" ]; then
            sed -i '/buildTypes {/,/}/ { /minifyEnabled true/d; /shrinkResources true/d }' android/app/build.gradle || true
          fi

      - name: Build & Package Signed APK
        env:
          VER_NAME: ${{ steps.meta.outputs.version_name }}
          VER_CODE: ${{ steps.meta.outputs.version_code }}
          SIGN_MODE: ${{ steps.signing.outputs.signing_mode }}
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease --no-daemon --stacktrace)
          
          cat << 'PKG_EOF' > /tmp/pkg.cjs
          const fs = require("fs");
          const path = require("path");
          const { execFileSync } = require("child_process");
          
          const buildTools = `${process.env.ANDROID_HOME}/build-tools/34.0.0`;
          const unsignedApk = "android/app/build/outputs/apk/release/app-release-unsigned.apk";
          const signedApk = "android/app/build/outputs/apk/release/app-release.apk";
          const alignedApk = "android/app/build/outputs/apk/release/app-release-aligned.apk";
          const finalApkName = `app-release-v${process.env.VER_NAME}.apk`;
          const outputDir = "release-output";
          
          fs.mkdirSync(outputDir, { recursive: true });
          
          // إذا كان Gradle قد وقّع التطبيق بالفعل
          if (fs.existsSync(signedApk)) {
            console.log("✅ تم العثور على APK موقع من Gradle");
            fs.copyFileSync(signedApk, path.join(outputDir, finalApkName));
          } 
          // إذا كان غير موقع، نقوم بمحاذاة وتوقيع يدوي
          else if (fs.existsSync(unsignedApk)) {
            console.log("⚙️ جاري محاذاة وتوقيع APK يدوياً...");
            execFileSync(`${buildTools}/zipalign`, ["-v", "-p", "4", unsignedApk, alignedApk], { stdio: "inherit" });
            execFileSync(`${buildTools}/apksigner`, [
              "sign", "--ks", process.env.ANDROID_KEYSTORE_PATH,
              "--ks-pass", `pass:${process.env.ANDROID_KEYSTORE_PASSWORD}`,
              "--ks-key-alias", process.env.ANDROID_KEY_ALIAS,
              "--key-pass", `pass:${process.env.ANDROID_KEY_PASSWORD}`,
              "--out", signedApk, alignedApk
            ], { stdio: "inherit" });
            fs.copyFileSync(signedApk, path.join(outputDir, finalApkName));
          } else {
            throw new Error("❌ لم يتم العثور على ملف APK (موقع أو غير موقع)");
          }
          
          console.log(`✅ تم حفظ التطبيق بنجاح: ${path.join(outputDir, finalApkName)}`);
          PKG_EOF
          
          node /tmp/pkg.cjs

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-mod-apk
          path: release-output/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event.inputs.create_github_release == 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/*.apk
          tag_name: ${{ steps.meta.outputs.version_name }}
          name: Release v${{ steps.meta.outputs.version_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
